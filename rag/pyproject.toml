[project]
name = "openworkbot-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<2.0",
    "mcp>=1.28,<2.0",
    "pymilvus>=3.0.1",
    "pypdf>=5,<7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
