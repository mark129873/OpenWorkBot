[project]
name = "assistant-harness-backend"
version = "0.1.0"
description = "个人助手 harness 后端（FastAPI + SQLite）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "mcp>=1.28,<2.0",
    "python-multipart>=0.0.9",
    "openai>=3.42.1",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
