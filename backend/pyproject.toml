[project]
name = "assistant-harness-backend"
version = "0.1.0"
description = "个人助手 harness 后端（FastAPI + SQLite / PostgreSQL）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mcp>=1.28,<2.0",
    "python-multipart>=0.0.9",
    "openai>=3.42.1",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint>=4.2.0,<5",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "jieba>=0.42.1,<1",
    "tiktoken>=0.9,<1",
    "langchain==1.3.14",
    "agent-sandbox==0.0.30",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "psycopg[binary]>=3.3.3",
]

[tool.uv]
constraint-dependencies = ["volcengine-python-sdk==5.0.25"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
